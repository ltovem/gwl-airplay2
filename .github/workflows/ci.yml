name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            compiler: gcc
          - name: Linux Clang
            os: ubuntu-latest
            compiler: clang
          - name: macOS
            os: macos-latest
            compiler: appleclang
          - name: Windows MSVC
            os: windows-latest
            compiler: msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            export CC=gcc
            export CXX=g++
          elif [[ "${{ matrix.compiler }}" == "clang" ]]; then
            export CC=clang
            export CXX=clang++
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGWL_AIRPLAY2_BUILD_DEMO=ON -DGWL_AIRPLAY2_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  ios:
    name: iOS Core
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure iOS
        run: >-
          cmake -S . -B build-ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DGWL_AIRPLAY2_BUILD_DEMO=OFF
          -DGWL_AIRPLAY2_BUILD_TESTS=OFF

      - name: Build iOS Core
        run: cmake --build build-ios --config Release

  tvos:
    name: tvOS Core
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure tvOS
        run: >-
          cmake -S . -B build-tvos -G Xcode
          -DCMAKE_SYSTEM_NAME=tvOS
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DGWL_AIRPLAY2_BUILD_DEMO=OFF
          -DGWL_AIRPLAY2_BUILD_TESTS=OFF

      - name: Build tvOS Core
        run: cmake --build build-tvos --config Release

  android:
    name: Android NDK Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK/NDK
        run: sdkmanager "platforms;android-24" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Configure Android
        shell: bash
        run: >-
          cmake -S . -B build-android
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-24
          -DANDROID_STL=c++_shared
          -DGWL_AIRPLAY2_BUILD_DEMO=OFF
          -DGWL_AIRPLAY2_BUILD_TESTS=OFF

      - name: Build Android Core
        run: cmake --build build-android --config Release --parallel

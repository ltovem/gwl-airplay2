name: Mobile CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  ios:
    name: iOS (${{ matrix.sdk }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: iphoneos
            arch: arm64
          - sdk: iphonesimulator
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build-ios-${{ matrix.sdk }} -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=${{ matrix.sdk }} \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DGWL_AIRPLAY2_BUILD_DEMO=OFF \
            -DGWL_AIRPLAY2_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build-ios-${{ matrix.sdk }} --config Release --parallel

  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Configure
        shell: bash
        run: |
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/27.2.12479018"
          cmake -S . -B build-android-${{ matrix.abi }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DGWL_AIRPLAY2_BUILD_DEMO=OFF \
            -DGWL_AIRPLAY2_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build-android-${{ matrix.abi }} --config Release --parallel

  tvos:
    name: tvOS Core
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build-tvos -G Xcode
          -DCMAKE_SYSTEM_NAME=tvOS
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DGWL_AIRPLAY2_BUILD_DEMO=OFF
          -DGWL_AIRPLAY2_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build-tvos --config Release --parallel
